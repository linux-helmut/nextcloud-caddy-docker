services:
  nextcloud:
    image: nextcloud:v1.0.0
    container_name: nextcloud

    networks:
      nextcloud:

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Berlin

    volumes:
      - /docker/clouds6967de/etc:/etc/php/8.4/cli
      - /docker/clouds6967de/etc:/etc/php/8.4/fpm
      - /docker/clouds6967de/html:/var/www/nextcloud
      - /docker/clouds6967de/data:/var/www/data

    restart: unless-stopped

networks:
  nextcloud:
    external: true
