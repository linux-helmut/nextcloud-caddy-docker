services:
  nc_redis:
    image: redis:alpine
    container_name: nc_redis

    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lfu
      --save ""
      --tcp-backlog 511

    networks:
      nextcloud:

    restart: unless-stopped

networks:
  nextcloud:
    name: ${DOCKER_NETWORK}
    external: true
