services:
  nc_caddy:
    image: caddy:latest
    container_name: nc_caddy

    networks:
      nextcloud:
        aliases:
          - cloud.lokal.de
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"

    volumes:
      - /docker/nc/caddy/caddyfile:/etc/caddy/Caddyfile
      - /docker/nc/caddy/data:/data/caddy
      - /docker/nc/caddy/config:/config/caddy
      - /docker/nc/nextcloud/html:/var/www/nextcloud:ro

#    dns:
#      - 1.1.1.1
#      - 8.8.8.8

    restart: unless-stopped

networks:
  nextcloud:
    external: true
    
