services:
  nc_caddy:
    env_file:
      - /docker/nc/config.env

    image: caddy:latest
    container_name: nc_caddy

    networks:
      nc_cloud:
        aliases:
          - ${NC_DOMAIN}

    dns:
      - ${DOCKER_DNS_IPV4}
      - ${DOCKER_DNS_IPV6}

    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"

    volumes:
      - /docker/nc/caddy/caddyfile:/etc/caddy/Caddyfile
      - /docker/nc/caddy/data:/data/caddy
      - /docker/nc/caddy/config:/config/caddy
      - /docker/nc/nextcloud/html:/var/www/nextcloud:ro

    restart: unless-stopped

networks:
  nc_cloud:
    name: ${DOCKER_NETWORK}
    external: true
