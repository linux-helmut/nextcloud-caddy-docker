services:
  nc_mariadb:
    image: mariadb:11.8
    container_name: nc_mariadb

    command:
      - mariadbd
      - --defaults-file=/etc/mysql/mariadb.cnf

    networks:
      nc_cloud:
      
    dns:
      - ${DOCKER_DNS_IPV4}
      - ${DOCKER_DNS_IPV6}
      
    environment:
      TZ: Europe/Berlin
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - /docker/nc/mariadb/db:/var/lib/mysql
      - /docker/nc/mariadb/mariadb.cnf:/etc/mysql/mariadb.cnf:ro

    restart: unless-stopped

networks:
  nc_cloud:
    name: ${DOCKER_NETWORK}
    external: true
