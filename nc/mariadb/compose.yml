services:
  nc_mariadb:
    image: mariadb:11.8
    container_name: nc_mariadb

    command:
      - mariadbd
      - --defaults-file=/etc/mysql/mariadb.cnf

    networks:
      nextcloud:

    environment:
      TZ: Europe/Berlin
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - /docker/nc/mariadb/db:/var/lib/mysql
      - /docker/nc/mariadb/mariadb.cnf:/etc/mysql/mariadb.cnf:ro

    restart: unless-stopped

networks:
  nextcloud:
    name: ${DOCKER_NETWORK}
    external: true
