services:
  nc_euro-office:
    image: ghcr.io/euro-office/documentserver:latest
    container_name: nc_euro-office
    restart: unless-stopped

    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${EUROOFFICE_JWT_SECRET}

    volumes:
      - /docker/nc/euro-office/data:/var/lib/euro-office/documentserver
      - /docker/nc/euro-office/private:/var/www/euro-office/Data

    networks:
      - nc_cloud
      
    dns:
      - ${DOCKER_DNS_IPV4}
      - ${DOCKER_DNS_IPV6}
      
networks:
  nc_cloud:
    external: true

