services:
  nc_cloud:
    env_file:
      - /docker/nc/config.env
    image: ${NC_IMAGE_NAME}:${NC_IMAGE_VERSION}
    container_name: nc_cloud

    build:
      context: .
      args:
        INSTALL_NODE26: ${INSTALL_NODE26:-false}

    networks:
      nc_cloud:
      
    dns:
      - ${DOCKER_DNS_IPV4}
      - ${DOCKER_DNS_IPV6}
      
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Berlin

    volumes:
      - /docker/nc/nextcloud/etc:/etc/php/8.4/cli
      - /docker/nc/nextcloud/etc:/etc/php/8.4/fpm
      - /docker/nc/nextcloud/html:/var/www/nextcloud
      - /docker/nc/nextcloud/data:/var/www/data

    restart: unless-stopped

networks:
  nc_cloud:
    name: ${DOCKER_NETWORK}
    external: true

