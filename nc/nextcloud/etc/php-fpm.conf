[global]
pid = /run/php/php8.5-fpm.pid


daemonize = no
error_log = /proc/self/fd/2



[www]
user = www-data
group = www-data


listen = 0.0.0.0:9000
clear_env = no


listen.owner = www-data
listen.group = www-data

catch_workers_output = yes
decorate_workers_output = no


pm = dynamic
pm.max_children = 50
pm.start_servers = 16
pm.min_spare_servers = 12
pm.max_spare_servers = 20
pm.max_requests = 200



